<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="messi-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1B3358" />
      <stop offset="50%" stop-color="#0F1B30" />
      <stop offset="100%" stop-color="#060B14" />
    </radialGradient>
    <linearGradient id="arg-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#75AADB" />
      <stop offset="100%" stop-color="#558CBE" />
    </linearGradient>
    <linearGradient id="gold-trophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="50%" stop-color="#F4B82A" />
      <stop offset="100%" stop-color="#B2820F" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#messi-bg)" />
  
  <!-- Golden Confetti / Stadium Glow from Lusail 2022 -->
  <circle cx="400" cy="220" r="180" fill="#F4B82A" opacity="0.1" filter="blur(30px)" />
  <circle cx="200" cy="140" r="120" fill="#75AADB" opacity="0.12" filter="blur(25px)" />
  
  <!-- Golden Confetti Dots -->
  <circle cx="220" cy="160" r="4" fill="#F4B82A" />
  <circle cx="260" cy="110" r="3" fill="#FFFFFF" />
  <circle cx="560" cy="140" r="5" fill="#F4B82A" />
  <circle cx="620" cy="190" r="3" fill="#FFFFFF" />

  <!-- Lionel Messi Figure: Iconic Arms Pointing to the Heavens -->
  <g id="messi-figure" transform="translate(0, 10)">
    
    <!-- Torso: Argentina Albiceleste #10 Stripes -->
    <path d="M 320,440 C 350,400 450,400 480,440 L 470,720 L 330,720 Z" fill="#FFFFFF" />
    <!-- Sky Blue Stripes -->
    <rect x="360" y="420" width="35" height="300" fill="url(#arg-sky)" />
    <rect x="420" y="420" width="35" height="300" fill="url(#arg-sky)" />
    <!-- Black Collar Accent & AFA 3 Stars Badge -->
    <path d="M 375,410 C 390,425 410,425 425,410 Z" fill="#111111" />
    <!-- 3 Golden Stars over AFA crest -->
    <circle cx="360" cy="445" r="3" fill="#F4B82A" />
    <circle cx="367" cy="440" r="3.5" fill="#F4B82A" />
    <circle cx="374" cy="445" r="3" fill="#F4B82A" />

    <!-- Number 10 and MESSI on Back/Chest -->
    <text x="400" y="550" font-family="'Syne', sans-serif" font-weight="900" font-size="52" fill="#0A162B" text-anchor="middle">10</text>
    <text x="400" y="480" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#0A162B" text-anchor="middle" letter-spacing="4">MESSI</text>

    <!-- Arms Raised High Pointing to the Sky (Grandmother Tribute) -->
    <!-- Left Arm -->
    <path d="M 325,440 L 250,280 L 220,180 L 250,170 L 280,270 L 350,430 Z" fill="#D39F75" />
    <!-- Left Hand & Index Finger Pointing Up -->
    <path d="M 220,180 L 210,130 L 225,128 L 235,175 Z" fill="#D39F75" />
    <circle cx="230" cy="180" r="16" fill="#D39F75" />

    <!-- Right Arm -->
    <path d="M 475,440 L 550,280 L 580,180 L 550,170 L 520,270 L 450,430 Z" fill="#D39F75" />
    <!-- Right Hand & Index Finger Pointing Up -->
    <path d="M 580,180 L 590,130 L 575,128 L 565,175 Z" fill="#D39F75" />
    <circle cx="570" cy="180" r="16" fill="#D39F75" />

    <!-- Head & Face Profile of Lionel Messi -->
    <rect x="385" y="360" width="30" height="45" fill="#D39F75" />
    <!-- Face Contour -->
    <path d="M 365,310 C 365,240 435,240 435,310 C 435,370 365,370 365,310 Z" fill="#DEAB82" />
    <!-- Brown Hair with distinctive comb -->
    <path d="M 360,300 C 355,230 445,215 440,285 C 410,240 375,260 360,300 Z" fill="#4A2F1B" />
    <!-- Brown Beard & Smile -->
    <path d="M 370,325 C 380,365 420,365 430,325 L 420,355 C 400,370 390,370 375,355 Z" fill="#5A3A22" />
    <!-- Eyes looking up with joy -->
    <ellipse cx="385" cy="295" rx="5" ry="3" fill="#2E1C0F" />
    <ellipse cx="415" cy="295" rx="5" ry="3" fill="#2E1C0F" />
    <!-- Joyful Smile -->
    <path d="M 390,325 Q 400,335 410,325" stroke="#2E1C0F" stroke-width="2.5" fill="none" />
  </g>

  <!-- World Cup 2022 Trophy In Front -->
  <g transform="translate(365, 590) scale(0.7)">
    <path d="M 50,0 C 70,40 85,70 85,110 L 70,200 L 30,200 L 15,110 C 15,70 30,40 50,0 Z" fill="url(#gold-trophy)" stroke="#F4B82A" stroke-width="2" />
    <circle cx="50" cy="15" r="28" fill="url(#gold-trophy)" />
    <!-- Malachite Green Rings at Base -->
    <rect x="25" y="175" width="50" height="6" fill="#007A4D" />
    <rect x="23" y="190" width="54" height="6" fill="#007A4D" />
  </g>

  <!-- Corner Badge -->
  <g transform="translate(40, 50)">
    <rect width="180" height="34" rx="6" fill="#060B14" opacity="0.8" stroke="#F4B82A" stroke-width="1.5" />
    <text x="90" y="22" font-family="'Syne', sans-serif" font-weight="800" font-size="12" fill="#F4B82A" text-anchor="middle" letter-spacing="1">LIONEL MESSI · #10</text>
  </g>
</svg>
