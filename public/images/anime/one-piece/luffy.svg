<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="luffy-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3A1C12" />
      <stop offset="50%" stop-color="#1F0E09" />
      <stop offset="100%" stop-color="#0B0503" />
    </radialGradient>
    <linearGradient id="straw-hat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="70%" stop-color="#F4B82A" />
      <stop offset="100%" stop-color="#C68A14" />
    </linearGradient>
    <linearGradient id="red-vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#9B1D20" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#luffy-bg)" />
  
  <!-- Gear 5 White Joyboy Clouds & Sun Aura -->
  <circle cx="400" cy="360" r="240" fill="#FFFFFF" opacity="0.08" filter="blur(35px)" />
  <circle cx="400" cy="300" r="160" fill="#F4B82A" opacity="0.12" filter="blur(30px)" />
  
  <!-- Swirling White Clouds of Gear 5 around neck/shoulders -->
  <path d="M 220,440 Q 280,380 340,430 Q 400,360 460,430 Q 520,380 580,440 Q 520,500 400,480 Q 280,500 220,440 Z" fill="#FFFFFF" opacity="0.25" filter="blur(4px)" />

  <!-- Monkey D. Luffy Figure -->
  <g id="luffy-figure" transform="translate(0, 20)">
    
    <!-- Red Vest & Open Torso with X-Scar -->
    <path d="M 310,480 C 330,440 470,440 490,480 L 510,750 L 290,750 Z" fill="#E8B282" />
    <!-- Red Vest Sides -->
    <path d="M 290,480 L 340,490 L 320,750 L 270,750 Z" fill="url(#red-vest)" />
    <path d="M 510,480 L 460,490 L 480,750 L 530,750 Z" fill="url(#red-vest)" />

    <!-- Iconic X-Chest Scar from Akainu -->
    <path d="M 360,540 L 440,640" stroke="#7A2021" stroke-width="12" stroke-linecap="round" />
    <path d="M 440,540 L 360,640" stroke="#7A2021" stroke-width="12" stroke-linecap="round" />
    <path d="M 365,545 L 435,635" stroke="#B84A4B" stroke-width="6" stroke-linecap="round" />
    <path d="M 435,545 L 365,635" stroke="#B84A4B" stroke-width="6" stroke-linecap="round" />

    <!-- Neck & Face -->
    <rect x="375" y="400" width="50" height="70" fill="#E8B282" />
    <!-- Jaw & Face Outline -->
    <path d="M 335,320 C 335,240 465,240 465,320 C 465,420 335,420 335,320 Z" fill="#F2C193" />

    <!-- Black Spiky Hair -->
    <path d="M 315,310 L 290,260 L 340,270 L 350,220 L 380,260 L 410,210 L 430,260 L 460,220 L 470,270 L 510,260 L 485,310 Z" fill="#151210" />

    <!-- Scar under left eye (2 stitches) -->
    <path d="M 360,335 C 362,345 365,355 372,360" stroke="#7A2021" stroke-width="3" fill="none" stroke-linecap="round" />
    <line x1="358" y1="345" x2="368" y2="343" stroke="#7A2021" stroke-width="2.5" />
    <line x1="362" y1="353" x2="371" y2="351" stroke="#7A2021" stroke-width="2.5" />

    <!-- Big Wide D-Smile (Iconic Luffy Grin) -->
    <path d="M 345,360 Q 400,430 455,360 Z" fill="#FFFFFF" stroke="#151210" stroke-width="3" />
    <path d="M 350,365 Q 400,420 450,365" stroke="#CCCCCC" stroke-width="1.5" fill="none" />
    <!-- Teeth divider lines -->
    <line x1="375" y1="375" x2="375" y2="395" stroke="#E0E0E0" stroke-width="1.5" />
    <line x1="400" y1="378" x2="400" y2="402" stroke="#E0E0E0" stroke-width="1.5" />
    <line x1="425" y1="375" x2="425" y2="395" stroke="#E0E0E0" stroke-width="1.5" />

    <!-- Big Round Expressive Eyes -->
    <circle cx="365" cy="315" r="14" fill="#FFFFFF" stroke="#151210" stroke-width="2" />
    <circle cx="365" cy="315" r="7" fill="#151210" />
    <circle cx="367" cy="313" r="2.5" fill="#FFFFFF" />

    <circle cx="435" cy="315" r="14" fill="#FFFFFF" stroke="#151210" stroke-width="2" />
    <circle cx="435" cy="315" r="7" fill="#151210" />
    <circle cx="437" cy="313" r="2.5" fill="#FFFFFF" />

    <!-- THE ICONIC STRAW HAT (Mugiwara) with Red Ribbon -->
    <!-- Hat Brim (Wide oval tilted slightly) -->
    <ellipse cx="400" cy="245" rx="195" ry="48" fill="url(#straw-hat)" stroke="#8C620B" stroke-width="3" />
    <!-- Hat Crown (Dome) -->
    <path d="M 310,240 C 310,130 490,130 490,240 Z" fill="url(#straw-hat)" stroke="#8C620B" stroke-width="2" />
    <!-- Red Ribbon on Crown Base -->
    <path d="M 310,240 C 310,205 490,205 490,240 L 490,248 C 490,215 310,215 310,248 Z" fill="#D62828" stroke="#7A1010" stroke-width="1.5" />
  </g>

  <!-- Corner Badge -->
  <g transform="translate(40, 50)">
    <rect width="210" height="34" rx="6" fill="#0B0503" opacity="0.8" stroke="#F4B82A" stroke-width="1.5" />
    <text x="105" y="22" font-family="'Syne', sans-serif" font-weight="800" font-size="12" fill="#F4B82A" text-anchor="middle" letter-spacing="1">MONKEY D. LUFFY · ONE PIECE</text>
  </g>
</svg>
