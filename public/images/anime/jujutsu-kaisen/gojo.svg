<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="gojo-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#210F38" />
      <stop offset="60%" stop-color="#0E0519" />
      <stop offset="100%" stop-color="#040108" />
    </radialGradient>
    <radialGradient id="hollow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E0AAFF" />
      <stop offset="60%" stop-color="#7B2CBF" />
      <stop offset="90%" stop-color="#3C096C" />
      <stop offset="100%" stop-color="#10002B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="six-eyes" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#80EAFF" />
      <stop offset="80%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#03045E" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#gojo-bg)" />
  
  <!-- Limitless Void Infinite Space Aura -->
  <circle cx="400" cy="300" r="260" fill="#7B2CBF" opacity="0.12" filter="blur(45px)" />
  <circle cx="580" cy="520" r="140" fill="#E0AAFF" opacity="0.2" filter="blur(30px)" />

  <!-- Satoru Gojo Figure -->
  <g id="gojo-figure" transform="translate(0, 15)">
    
    <!-- Jujutsu High High-Collar Black Uniform -->
    <path d="M 310,460 C 330,420 470,420 490,460 L 515,750 L 285,750 Z" fill="#0D0E15" stroke="#1F1D2C" stroke-width="2" />
    <path d="M 345,430 L 455,430 L 440,490 L 360,490 Z" fill="#161824" />
    <!-- Golden Swirl Button on Left Collar -->
    <circle cx="365" cy="460" r="7" fill="#F4B82A" stroke="#8C6514" stroke-width="2" />

    <!-- Neck & Face -->
    <rect x="380" y="380" width="40" height="50" fill="#FCEADE" />
    <path d="M 340,300 C 340,200 460,200 460,300 C 460,400 340,400 340,300 Z" fill="#FFF1E6" />

    <!-- Black Blindfold Tilted Up slightly to reveal the Six Eyes -->
    <path d="M 330,270 L 470,270 L 465,310 L 335,310 Z" fill="#12131A" stroke="#000000" stroke-width="2" />
    <!-- Blindfold Knot / Texture -->
    <line x1="335" y1="290" x2="465" y2="290" stroke="#252733" stroke-width="1.5" />

    <!-- THE SIX EYES (Rikugan) Radiating Crystalline Infinity Blue -->
    <ellipse cx="375" cy="300" rx="14" ry="10" fill="url(#six-eyes)" />
    <circle cx="375" cy="300" r="4" fill="#FFFFFF" opacity="0.9" />
    <circle cx="375" cy="300" r="18" fill="#80EAFF" opacity="0.3" filter="blur(3px)" />

    <ellipse cx="425" cy="300" rx="14" ry="10" fill="url(#six-eyes)" />
    <circle cx="425" cy="300" r="4" fill="#FFFFFF" opacity="0.9" />
    <circle cx="425" cy="300" r="18" fill="#80EAFF" opacity="0.3" filter="blur(3px)" />

    <!-- Calm Confident Smile -->
    <path d="M 385,360 Q 400,370 415,360" stroke="#2B1A2F" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Spiky Pure Snow-White Hair (Gojo) -->
    <path d="M 325,270 L 290,210 L 330,220 L 315,140 L 360,180 L 375,100 L 400,150 L 430,95 L 445,170 L 485,130 L 475,210 L 515,200 L 475,270 Z" fill="#F8F9FA" stroke="#D7DADC" stroke-width="2" />
    <!-- Soft blue shadow on hair underside -->
    <polygon points="340,240 370,200 390,240" fill="#E6EEF8" />
    <polygon points="410,240 430,195 455,240" fill="#E6EEF8" />

    <!-- Right Hand In Front: Finger Snap Gesture for Hollow Purple (Kyoshiki: Murasaki) -->
    <g transform="translate(520, 480)">
      <path d="M 0,0 L 40,-30 L 70,0 L 50,50 L 10,40 Z" fill="#FFF1E6" />
      <!-- Crossed index and thumb pinching space -->
      <circle cx="60" cy="0" r="14" fill="#FCEADE" />
    </g>
  </g>

  <!-- HOLLOW PURPLE ENERGY SPHERE (Red + Blue Convergence) -->
  <g transform="translate(600, 490)">
    <circle cx="0" cy="0" r="75" fill="url(#hollow-purple)" />
    <circle cx="0" cy="0" r="30" fill="#FFFFFF" opacity="0.95" />
    <!-- Red (Cursed Technique Reversal) and Blue (Lapse) arcs colliding -->
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="#FF0055" stroke-width="3" transform="rotate(40)" />
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="#00D4FF" stroke-width="3" transform="rotate(130)" />
  </g>

  <!-- Corner Badge -->
  <g transform="translate(40, 50)">
    <rect width="210" height="34" rx="6" fill="#040108" opacity="0.8" stroke="#F4B82A" stroke-width="1.5" />
    <text x="105" y="22" font-family="'Syne', sans-serif" font-weight="800" font-size="12" fill="#F4B82A" text-anchor="middle" letter-spacing="1">SATORU GOJO · JUJUTSU KAISEN</text>
  </g>
</svg>
