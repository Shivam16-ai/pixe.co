<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="naruto-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3D1D09" />
      <stop offset="60%" stop-color="#1F0E04" />
      <stop offset="100%" stop-color="#080402" />
    </radialGradient>
    <radialGradient id="rasengan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#70D6FF" />
      <stop offset="70%" stop-color="#00A8E8" />
      <stop offset="100%" stop-color="#003459" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="orange-jacket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7700" />
      <stop offset="100%" stop-color="#D95300" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#naruto-bg)" />
  
  <!-- Warm Orange & Cyan Chakra Aura -->
  <circle cx="400" cy="300" r="220" fill="#FF8800" opacity="0.1" filter="blur(40px)" />
  <circle cx="560" cy="560" r="140" fill="#00A8E8" opacity="0.25" filter="blur(30px)" />

  <!-- Naruto Uzumaki Figure -->
  <g id="naruto-figure" transform="translate(0, 20)">
    
    <!-- Torso: Orange Jacket with High Black & White Collar -->
    <path d="M 310,460 C 330,410 470,410 490,460 L 520,750 L 280,750 Z" fill="url(#orange-jacket)" />
    <!-- Black Shoulder Bands -->
    <path d="M 280,480 L 330,460 L 310,540 L 270,520 Z" fill="#1C1A17" />
    <path d="M 520,480 L 470,460 L 490,540 L 530,520 Z" fill="#1C1A17" />
    <!-- White High Collar -->
    <path d="M 340,430 C 360,400 440,400 460,430 L 440,480 C 420,490 380,490 360,480 Z" fill="#EDE9DF" stroke="#111111" stroke-width="2" />
    <!-- Red Uzumaki Swirl Crest on Left Arm/Back -->
    <circle cx="340" cy="560" r="24" fill="#D62828" stroke="#111111" stroke-width="2" />
    <path d="M 340,550 A 10,10 0 1,1 340,570 A 5,5 0 1,0 340,560" fill="none" stroke="#FFFFFF" stroke-width="3" />

    <!-- Neck & Face -->
    <rect x="380" y="380" width="40" height="40" fill="#F4BD8C" />
    <path d="M 340,300 C 340,210 460,210 460,300 C 460,400 340,400 340,300 Z" fill="#F8CBA1" />

    <!-- 3 Whiskers on Each Cheek (Kyuubi Kurama marks) -->
    <!-- Left Cheek Whiskers -->
    <line x1="345" y1="330" x2="375" y2="333" stroke="#2B1A0F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="342" y1="342" x2="376" y2="343" stroke="#2B1A0F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="346" y1="354" x2="374" y2="353" stroke="#2B1A0F" stroke-width="2.5" stroke-linecap="round" />
    <!-- Right Cheek Whiskers -->
    <line x1="455" y1="330" x2="425" y2="333" stroke="#2B1A0F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="458" y1="342" x2="424" y2="343" stroke="#2B1A0F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="454" y1="354" x2="426" y2="353" stroke="#2B1A0F" stroke-width="2.5" stroke-linecap="round" />

    <!-- Bright Blue Eyes & Confident Grin -->
    <ellipse cx="375" cy="305" rx="10" ry="12" fill="#0096C7" stroke="#151210" stroke-width="2" />
    <circle cx="375" cy="305" r="5" fill="#023E8A" />
    <circle cx="377" cy="302" r="2.5" fill="#FFFFFF" />

    <ellipse cx="425" cy="305" rx="10" ry="12" fill="#0096C7" stroke="#151210" stroke-width="2" />
    <circle cx="425" cy="305" r="5" fill="#023E8A" />
    <circle cx="427" cy="302" r="2.5" fill="#FFFFFF" />

    <!-- Confident Grin -->
    <path d="M 380,355 Q 400,370 420,355" stroke="#151210" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Konoha Forehead Protector (Hitai-ate) -->
    <!-- Black Cloth Band -->
    <rect x="330" y="240" width="140" height="35" rx="4" fill="#1C1B1A" />
    <!-- Metallic Steel Plate -->
    <rect x="360" y="242" width="80" height="30" rx="3" fill="#D3D3D3" stroke="#888888" stroke-width="2" />
    <circle cx="366" cy="248" r="2" fill="#555555" />
    <circle cx="434" cy="248" r="2" fill="#555555" />
    <circle cx="366" cy="266" r="2" fill="#555555" />
    <circle cx="434" cy="266" r="2" fill="#555555" />
    <!-- Leaf Village Spiral Emblem -->
    <path d="M 395,257 A 5,5 0 1,1 405,257 A 2.5,2.5 0 1,0 400,257" fill="none" stroke="#222222" stroke-width="2.5" />
    <path d="M 397,257 L 390,265" stroke="#222222" stroke-width="2.5" stroke-linecap="round" />

    <!-- Spiky Golden-Blonde Hair -->
    <path d="M 320,245 L 290,190 L 330,200 L 325,140 L 360,170 L 375,110 L 400,150 L 425,110 L 440,170 L 475,140 L 470,200 L 510,190 L 480,245 Z" fill="#FFD000" stroke="#CC9900" stroke-width="2" />
  </g>

  <!-- Glowing Swirling Rasengan in Hand -->
  <g transform="translate(560, 560)">
    <!-- Swirling Chakra trails -->
    <circle cx="0" cy="0" r="85" fill="url(#rasengan-glow)" />
    <circle cx="0" cy="0" r="45" fill="#FFFFFF" opacity="0.9" />
    <!-- Chakra swirl lines -->
    <ellipse cx="0" cy="0" rx="65" ry="25" fill="none" stroke="#00B4D8" stroke-width="3" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="65" ry="25" fill="none" stroke="#90E0EF" stroke-width="3" transform="rotate(110)" />
    <ellipse cx="0" cy="0" rx="65" ry="25" fill="none" stroke="#0077B6" stroke-width="3" transform="rotate(70)" />
  </g>

  <!-- Corner Badge -->
  <g transform="translate(40, 50)">
    <rect width="210" height="34" rx="6" fill="#080402" opacity="0.8" stroke="#F4B82A" stroke-width="1.5" />
    <text x="105" y="22" font-family="'Syne', sans-serif" font-weight="800" font-size="12" fill="#F4B82A" text-anchor="middle" letter-spacing="1">NARUTO UZUMAKI · 7TH HOKAGE</text>
  </g>
</svg>
