app = "replace-with-a-unique-fly-app-name"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_URL = "file:/data/dev.db"
  UPLOADS_DIR = "/data/uploads"
  APP_URL = "https://replace-with-a-unique-fly-app-name.fly.dev"
  FRONTEND_URL = "https://replace-with-a-unique-fly-app-name.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[mounts]]
  source = "pixe_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
